
name: Daily Bali Surf Forecast

on:
  schedule:
    - cron: "7 1 * * *"
  workflow_dispatch:

jobs:
  forecast:
    # Superseded by surf-review.yml; never bypass Leo's approval.
    if: ${{ false }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run surf forecast bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python main3_package.py

      - name: Test Surfline endpoints
        run: python main3_package.py

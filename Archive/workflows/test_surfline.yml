name: Test Surfline Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify Surfline installation
        run: |
          python -m pip show surf-mcp
          python -c "import surf_mcp; print('Surfline library imported successfully')"
      

      - name: Test Surfline
        run: python test_surfline.py

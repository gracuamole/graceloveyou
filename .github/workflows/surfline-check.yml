name: Surfline forecast check (no Telegram)
on:
  workflow_dispatch:
    inputs:
      forecast_date:
        description: 'Optional YYYY-MM-DD; leave blank for tomorrow in Bali'
        required: false
        default: ''
        type: string
permissions:
  contents: write
concurrency:
  group: surf-review-state
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install tested dependencies
        run: pip install -r requirements.txt
      - uses: actions/checkout@v4
        with:
          ref: review-state
          path: review-state
      - name: Configure request checkpoint author
        run: |
          git -C review-state config user.name 'surf-review-bot'
          git -C review-state config user.email 'surf-review-bot@users.noreply.github.com'
      - name: Fetch and validate Surfline forecast (read-only)
        env:
          SURF_ATTEMPT_FILE: review-state/fetch-attempt.json
          SURF_ATTEMPT_PERSIST_GIT: 'true'
          SURF_REQUEST_PROTECTION: ${{ vars.SURF_REQUEST_PROTECTION || 'true' }}
          SURF_INCOMPLETE_DRAFTS: ${{ vars.SURF_INCOMPLETE_DRAFTS || 'true' }}
          FORECAST_DATE: ${{ inputs.forecast_date }}
        run: python surfline_check.py --date "$FORECAST_DATE"

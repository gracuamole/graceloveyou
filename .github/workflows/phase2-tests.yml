name: Phase 2 rules tests
on:
  pull_request:
  push:
    # This branch stores delivery state and can contain an older source tree.
    # Apply this filter to any existing copy of this workflow on review-state too.
    branches-ignore:
      - review-state
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v

  webhook-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test cloudflare/worker.test.mjs

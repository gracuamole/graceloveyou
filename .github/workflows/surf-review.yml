name: Reviewed next-day surf report
on:
  schedule:
    - cron: '7 1 * * *'
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      resend_published:
        description: 'Send report again for testing (fresh approval required)'
        type: boolean
        required: false
        default: false
      move_review_chat:
        description: 'Move review to the configured chat (use alone; Leo must /start there)'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: surf-review-state
  cancel-in-progress: false
jobs:
  review:
    # In webhook mode replies trigger workflow_dispatch; keep only daily cron as backup.
    if: ${{ vars.SURF_REVIEW_ENABLED == 'true' && (vars.SURF_REVIEW_TRANSPORT != 'webhook' || github.event_name != 'schedule' || github.event.schedule == '7 1 * * *') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      # Missing branch intentionally fails before accessing Telegram.
      - uses: actions/checkout@v4
        with:
          ref: review-state
          path: review-state
      - name: Configure state commit author
        run: |
          git -C review-state config user.name 'surf-review-bot'
          git -C review-state config user.email 'surf-review-bot@users.noreply.github.com'
      - name: Inspect saved review status (read-only)
        run: python review_bot.py --status --state review-state/state.json
      - name: Poll reviews and advance durable workflow
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          LEO_TELEGRAM_USER_ID: ${{ secrets.LEO_TELEGRAM_USER_ID }}
          OWNER_TELEGRAM_USER_ID: ${{ secrets.OWNER_TELEGRAM_USER_ID }}
          LEO_TELEGRAM_CHAT_ID: ${{ secrets.LEO_TELEGRAM_CHAT_ID }}
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SURF_REVIEW_TRANSPORT: ${{ vars.SURF_REVIEW_TRANSPORT || 'poll' }}
          SURF_WEBHOOK_URL: ${{ vars.SURF_WEBHOOK_URL }}
          SURF_WEBHOOK_TOKEN: ${{ secrets.SURF_WEBHOOK_TOKEN }}
          # Webhook/cron dispatches omit this input and cannot resend a complete review.
          SURF_RESEND_PUBLISHED: ${{ github.event_name == 'workflow_dispatch' && inputs.resend_published == true && 'true' || 'false' }}
          SURF_MOVE_REVIEW_CHAT: ${{ github.event_name == 'workflow_dispatch' && inputs.move_review_chat == true && 'true' || 'false' }}
        run: |
          args=()
          if [ "$SURF_RESEND_PUBLISHED" = "true" ]; then
            args+=(--resend-published)
          fi
          if [ "$SURF_MOVE_REVIEW_CHAT" = "true" ]; then
            args+=(--move-review-chat)
          fi
          python review_bot.py --run --persist-git --state review-state/state.json "${args[@]}"
